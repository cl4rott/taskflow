<ion-header>
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Nova Tarefa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="content">

  <div class="container">

    <ion-item class="input">
      <ion-input
        placeholder="Ex: Estudar Ionic"
        label="Título da tarefa"
        labelPlacement="stacked">
      </ion-input>
    </ion-item>

    <div class="row">

      <ion-item class="input small">
        <ion-input
          placeholder="dd/mm"
          label="Data"
          labelPlacement="stacked">
        </ion-input>
      </ion-item>

      <ion-item class="input small">
        <ion-input
          placeholder="hh:mm"
          label="Hora"
          labelPlacement="stacked">
        </ion-input>
      </ion-item>

    </div>

    <ion-item class="input">
      <ion-textarea
        placeholder="Ex: Revisar conteúdo"
        label="Descrição (Opcional)"
        labelPlacement="stacked">
      </ion-textarea>
    </ion-item>

    <div class="row">

      <ion-item class="input small">
        <ion-select
          label="Categoria"
          labelPlacement="stacked"
          placeholder="Trabalho">

          <ion-select-option value="trabalho">
            Trabalho
          </ion-select-option>

          <ion-select-option value="estudo">
            Estudo
          </ion-select-option>

        </ion-select>
      </ion-item>

      <ion-item class="input small">
        <ion-select
          label="Prioridade"
          labelPlacement="stacked"
          placeholder="Alta">

          <ion-select-option value="alta">
            Alta
          </ion-select-option>

          <ion-select-option value="media">
            Média
          </ion-select-option>

          <ion-select-option value="baixa">
            Baixa
          </ion-select-option>

        </ion-select>
      </ion-item>

    </div>

    <ion-button expand="block" class="save-btn">
      Salvar
    </ion-button>

  </div>

</ion-content>
